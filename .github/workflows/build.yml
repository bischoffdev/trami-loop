name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version override (e.g. 0.2.0); defaults to VERSION file'
        required: false
        default: ''
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.platform_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform_name: macOS
          - os: windows-2022
            platform_name: Windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Cache JUCE and dependencies downloaded via FetchContent
      - name: Cache FetchContent
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-fetchcontent-${{ hashFiles('CMakeLists.txt', 'cmake/Dependencies.cmake') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      - name: Resolve Version
        id: ver
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "release" ] && [ -n "$RELEASE_TAG" ]; then
            RAW_VER="$RELEASE_TAG"
          elif [ -n "$INPUT_VERSION" ]; then
            RAW_VER="$INPUT_VERSION"
          else
            RAW_VER=$(tr -d '[:space:]' < VERSION)
          fi
          CLEAN_VER="${RAW_VER#v}"
          if ! [[ "$CLEAN_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9._-]+)?$ ]]; then
            echo "Error: Invalid version string '$CLEAN_VER'"
            exit 1
          fi
          echo "version=$CLEAN_VER" >> "$GITHUB_OUTPUT"
          echo "Resolved version: v$CLEAN_VER"

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        env:
          TRAMI_VER: ${{ steps.ver.outputs.version }}
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DTRAMI_VERSION="$TRAMI_VER" \
            -DTRAMI_BUILD_TESTS=ON

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          TRAMI_VER: ${{ steps.ver.outputs.version }}
        run: |
          cmake -B build -A x64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DTRAMI_VERSION="$TRAMI_VER" \
            -DTRAMI_BUILD_TESTS=ON

      - name: Build Application (Release, macOS)
        if: runner.os == 'macOS'
        run: |
          cmake --build build --config Release --parallel 3

      - name: Build Application (Release, Windows)
        if: runner.os == 'Windows'
        run: |
          cmake --build build --config Release --parallel 4

      - name: Run Tests
        run: |
          ctest --test-dir build -C Release --output-on-failure

      # Code-sign & optionally notarize macOS app (falls back to ad-hoc signing when secrets are unset)
      - name: Sign & Notarize (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          APP_PATH=$(find build -name "TramiLoop.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: TramiLoop.app not found"
            exit 1
          fi

          if [ -n "$APPLE_CERT_BASE64" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            echo "Signing with Developer ID..."
            KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
            KEYCHAIN_PASS="temp-ci-pass-$(date +%s)"
            echo "$APPLE_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security list-keychain -d user -s "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

            codesign --force --deep --options runtime --timestamp \
              --entitlements cmake/entitlements.plist \
              --sign "$APPLE_SIGNING_IDENTITY" "$APP_PATH"

            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
              echo "Submitting for Apple Notarization..."
              ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/notarize.zip"
              xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
                --apple-id "$APPLE_ID" \
                --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_APP_PASSWORD" \
                --wait
              xcrun stapler staple "$APP_PATH"
            fi
          else
            echo "No Developer ID secrets configured — applying ad-hoc signature with entitlements..."
            codesign --force --deep --sign - --entitlements cmake/entitlements.plist "$APP_PATH"
          fi

      # Optionally Authenticode-sign Windows executable when secrets are configured
      - name: Sign Executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WIN_CERT_BASE64: ${{ secrets.WIN_CERT_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          if ($env:WIN_CERT_BASE64) {
            $exe = (Get-ChildItem -Path build -Filter "TramiLoop.exe" -Recurse | Select-Object -First 1).FullName
            $pfxPath = "$env:RUNNER_TEMP\win_cert.pfx"
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WIN_CERT_BASE64))
            $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
            & $signtool sign /f $pfxPath /p $env:WIN_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $exe
            Remove-Item $pfxPath -Force
          } else {
            Write-Host "No Windows signing certificate secrets configured — skipping Authenticode signing."
          }

      # Package artifacts for release / download
      - name: Stage Artifacts & Build DMG Installer (macOS)
        if: runner.os == 'macOS'
        env:
          TRAMI_VER: ${{ steps.ver.outputs.version }}
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          mkdir -p artifacts dmg_root
          APP_PATH=$(find build -name "TramiLoop.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: TramiLoop.app not found"
            exit 1
          fi

          echo "Packaging $APP_PATH (v$TRAMI_VER)..."
          ditto -c -k --keepParent "$APP_PATH" "artifacts/TramiLoop-v${TRAMI_VER}-macOS.zip"

          cp -R "$APP_PATH" dmg_root/
          ln -s /Applications dmg_root/Applications
          DMG_PATH="artifacts/TramiLoop-v${TRAMI_VER}-macOS.dmg"
          hdiutil create -volname "TramiLoop v${TRAMI_VER}" -srcfolder dmg_root -ov -format UDZO "$DMG_PATH"

          if [ -n "$APPLE_CERT_BASE64" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$DMG_PATH"
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
              xcrun notarytool submit "$DMG_PATH" \
                --apple-id "$APPLE_ID" \
                --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_APP_PASSWORD" \
                --wait
              xcrun stapler staple "$DMG_PATH"
            fi
          fi

      - name: Stage Artifacts & Build Inno Setup Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TRAMI_VER: ${{ steps.ver.outputs.version }}
          WIN_CERT_BASE64: ${{ secrets.WIN_CERT_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $exe = (Get-ChildItem -Path build -Filter "TramiLoop.exe" -Recurse | Select-Object -First 1).FullName
          if (-not $exe) {
            Write-Error "TramiLoop.exe not found"
            exit 1
          }

          Write-Host "Packaging portable zip (v$env:TRAMI_VER)..."
          7z a "artifacts/TramiLoop-v$($env:TRAMI_VER)-Windows-Portable.zip" "$exe"

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            Write-Host "Building Inno Setup installer..."
            & $iscc "/DMyAppVersion=$($env:TRAMI_VER)" "/DMyAppExePath=$exe" "/DMyOutputDir=..\..\artifacts" "installer\windows\trami-loop.iss"
            $setupExe = "artifacts\TramiLoop-v$($env:TRAMI_VER)-Windows-Setup.exe"
            if ($env:WIN_CERT_BASE64 -and (Test-Path $setupExe)) {
              $pfxPath = "$env:RUNNER_TEMP\win_cert.pfx"
              [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WIN_CERT_BASE64))
              $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
              & $signtool sign /f $pfxPath /p $env:WIN_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $setupExe
              Remove-Item $pfxPath -Force
            }
          }

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TramiLoop-${{ matrix.platform_name }}
          path: artifacts/
          if-no-files-found: error

      - name: Add to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

